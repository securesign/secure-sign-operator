name: Pruner
on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *" # run every day at midnight

jobs:
  clean-image-registry:
    runs-on: ubuntu-latest
    name: Delete old dev images
    permissions:
      packages: write
    steps:
      - uses: snok/container-retention-policy@d3bdcf5ce9b05f685154e4a16c39233b245e3d53 # v3.1.0
        with:
          account: securesign
          token: ${{ secrets.GITHUB_TOKEN }}
          image-names: "secure-sign-operator"
          image-tags: "dev-*"
          cut-off: 3d
          dry-run: false
      - uses: snok/container-retention-policy@d3bdcf5ce9b05f685154e4a16c39233b245e3d53 # v3.1.0
        with:
          account: securesign
          token: ${{ secrets.GITHUB_TOKEN }}
          image-names: "secure-sign-operator-bundle"
          image-tags: "dev-*"
          cut-off: 3d
          dry-run: false
      - uses: snok/container-retention-policy@d3bdcf5ce9b05f685154e4a16c39233b245e3d53 # v3.1.0
        with:
          account: securesign
          token: ${{ secrets.GITHUB_TOKEN }}
          image-names: "secure-sign-operator-fbc"
          image-tags: "dev-*"
          cut-off: 3d
          dry-run: false

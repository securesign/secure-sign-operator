version: "2"
run:
  build-tags:
    - integration
    - upgrade
    - custom_install
  allow-parallel-runners: true
linters:
  default: none
  enable:
    - actionlint
    - copyloopvar
    - errcheck
    - ginkgolinter
    - goconst
    - gocyclo
    - govet
    - ineffassign
    - kubeapilinter
    - misspell
    - nakedret
    - prealloc
    - staticcheck
    - unconvert
    - unparam
    - unused
  settings:
    custom:
      actionlint:
        type: "module"
        description: "Checks action framework patterns (PersistStatus errors, Spec mutations)"
      kubeapilinter:
        type: "module"
        description: "Kube API Linter"
        settings:
          linters:
            disable:
              - nodurations
              - nonpointerstructs
              - optionalfields
              - requiredfields
              - commentstart
              - uniquemarkers
              - duplicatemarkers
    staticcheck:
      dot-import-whitelist:
        - github.com/onsi/gomega
        - github.com/onsi/ginkgo/v2
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
    rules:
      - linters:
          - kubeapilinter
        path-except: ^api/v1/
      - linters:
          - goconst
        path: (_test\.go$|^test/|^internal/testing/)
formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$

apiVersion: rhtas.redhat.com/v1
kind: Trillian
metadata:
  labels:
    app.kubernetes.io/name: securesign-sample
    app.kubernetes.io/instance: securesign-sample
    app.kubernetes.io/part-of: trusted-artifact-signer
  name: trillian-sample
spec:
  database:
    create: true
    pvc:
      size: 5Gi
      retain: true
      accessModes:
        - ReadWriteOnce
  monitoring:
    metrics:
      enabled: true
    serviceMonitor:
      enabled: true
  server:
    replicas: 1
  signer:
    replicas: 1
